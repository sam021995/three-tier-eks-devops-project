name: Application Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - dev
          - test
          - prod

permissions:
  id-token: write
  contents: read
  security-events: write
  actions: read

env:
  AWS_REGION: eu-west-1
  ECR_REGISTRY: 628658447302.dkr.ecr.eu-west-1.amazonaws.com
  FRONTEND_REPO: frontend
  BACKEND_REPO: backend
  GITHUB_ROLE_ARN: arn:aws:iam::628658447302:role/GitHubActionsEKSDeployRole

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials Using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Frontend Image
        run: |
          cd app/frontend
          docker build \
            -t $ECR_REGISTRY/$FRONTEND_REPO:${{ github.run_number }} \
            -t $ECR_REGISTRY/$FRONTEND_REPO:latest .

      - name: Scan Frontend Image With Trivy - TXT
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:${{ github.run_number }}
          format: table
          output: trivy-frontend-report.txt
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Upload Frontend Trivy TXT Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend-txt-report
          path: trivy-frontend-report.txt

      - name: Scan Frontend Image With Trivy - SARIF
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:${{ github.run_number }}
          format: sarif
          output: trivy-frontend-results.sarif
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0

      - name: Upload Frontend SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend-results.sarif
          category: trivy-frontend

      - name: Upload Frontend Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend-report
          path: trivy-frontend-report.txt

      - name: Push Frontend Image
        run: |
          docker push $ECR_REGISTRY/$FRONTEND_REPO:${{ github.run_number }}
          docker push $ECR_REGISTRY/$FRONTEND_REPO:latest

      - name: Build Backend Image
        run: |
          cd app/backend
          docker build \
            -t $ECR_REGISTRY/$BACKEND_REPO:${{ github.run_number }} \
            -t $ECR_REGISTRY/$BACKEND_REPO:latest .

      - name: Scan Backend Image With Trivy - TXT
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:${{ github.run_number }}
          format: table
          output: trivy-backend-report.txt
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Upload Backend Trivy TXT Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-txt-report
          path: trivy-backend-report.txt

      - name: Scan Backend Image With Trivy - SARIF
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:${{ github.run_number }}
          format: sarif
          output: trivy-backend-results.sarif
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0

      - name: Upload Backend SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend-results.sarif
          category: trivy-backend

      - name: Upload Backend Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-report
          path: trivy-backend-report.txt

      - name: Push Backend Image
        run: |
          docker push $ECR_REGISTRY/$BACKEND_REPO:${{ github.run_number }}
          docker push $ECR_REGISTRY/$BACKEND_REPO:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials Using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Ensure GitHub OIDC Role Has EKS Access
        run: |
          aws eks create-access-entry \
            --cluster-name three-tier-eks-${{ github.event.inputs.environment }} \
            --region $AWS_REGION \
            --principal-arn ${{ env.GITHUB_ROLE_ARN }} \
            --type STANDARD || true
          aws eks associate-access-policy \
            --cluster-name three-tier-eks-${{ github.event.inputs.environment }} \
            --region $AWS_REGION \
            --principal-arn ${{ env.GITHUB_ROLE_ARN }} \
            --policy-arn arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy \
            --access-scope type=cluster || true

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region $AWS_REGION --name three-tier-eks-${{ github.event.inputs.environment }}

      - name: Helm Lint Employee App Chart
        run: |
          helm lint helm/employee-app-chart -f helm/employee-app-chart/values-${{ github.event.inputs.environment }}.yaml

      - name: Deploy Application Using Helm
        run: |
          helm upgrade employee-app helm/employee-app-chart \
            --install \
            --namespace employee-app \
            --create-namespace \
            -f helm/employee-app-chart/values-${{ github.event.inputs.environment }}.yaml \
            --set frontend.image.repository=$ECR_REGISTRY/$FRONTEND_REPO \
            --set frontend.image.tag=${{ github.run_number }} \
            --set backend.image.repository=$ECR_REGISTRY/$BACKEND_REPO \
            --set backend.image.tag=${{ github.run_number }} \
            --wait \
            --atomic \
            --timeout 5m

      - name: Verify Frontend Rollout
        run: |
          kubectl rollout status deployment/frontend -n employee-app --timeout=120s

      - name: Verify Backend Rollout
        run: |
          kubectl rollout status deployment/backend -n employee-app --timeout=120s
